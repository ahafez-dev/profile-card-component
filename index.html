<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card Component</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body
    class="bg-[#19a2ae] h-screen flex items-center justify-center font-sans p-4 overflow-hidden"
  >
    <!-- Background Patterns Wrapper -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
      <img
        src="./images/bg-pattern-top.svg"
        alt=""
        class="absolute -top-80 -left-19 w-[700px]"
      />
      <img
        src="./images/bg-pattern-bottom.svg"
        alt=""
        class="absolute -bottom-129 -right-35 w-[800px]"
      />
    </div>

    <!-- Profile Card -->
    <main
      class="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden text-center z-10"
    >
      <!-- Top Section -->
      <div class="relative">
        <div
          class="h-36 bg-cover bg-center"
          style="background-image: url('./images/bg-pattern-card.svg')"
        ></div>

        <img
          src="./images/image-victor.jpg"
          alt="Victor Crest"
          class="w-24 h-24 rounded-full border-4 border-white absolute -bottom-12 left-1/2 -translate-x-1/2 shadow-md"
        />
      </div>

      <!-- Profile Info -->
      <div class="px-6 pb-6 pt-16 border-b border-gray-200">
        <h1 class="text-lg font-bold text-gray-800">
          Victor Crest <span class="font-normal text-gray-500">26</span>
        </h1>
        <p class="text-sm text-gray-400 mt-1">London</p>
      </div>

      <!-- Stats Footer -->
      <div class="flex justify-around items-center p-6 text-center">
        <div>
          <h2 class="text-lg font-bold text-gray-800">80K</h2>
          <p class="text-xs text-gray-400 tracking-wider uppercase mt-1">
            Followers
          </p>
        </div>
        <div>
          <h2 class="text-lg font-bold text-gray-800">803K</h2>
          <p class="text-xs text-gray-400 tracking-wider uppercase mt-1">
            Likes
          </p>
        </div>
        <div>
          <h2 class="text-lg font-bold text-gray-800">1.4K</h2>
          <p class="text-xs text-gray-400 tracking-wider uppercase mt-1">
            Photos
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
